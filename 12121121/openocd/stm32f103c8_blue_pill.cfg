# ---------------------------------------------------------------------------
# STM32F103C8 "Blue Pill" —— 自定义板级配置
#
# 为什么需要这个文件：
#   OpenOCD 自带的 board/stm32f103c8_blue_pill.cfg 只包含芯片目标定义
#   （target/stm32f1x.cfg），不含任何调试器接口配置。
#   CLion 的 OpenOCD 下载并运行配置只能指定一个 cfg 文件，
#   所以在此把接口配置（ST-LINK）和芯片定义合并到一起。
#
# 注意：source 顺序不能改，接口必须在 target 之前。
# ---------------------------------------------------------------------------

# 调试器：ST-LINK (hla 驱动，兼容 ST-LINK V1/V2/V2-1/V3 及常见克隆版)
source [find interface/stlink.cfg]

# Blue Pill 常见的 128KB Flash 覆盖（若确认是 64KB 版本可注释掉本行）
set FLASH_SIZE 0x20000

# 芯片目标定义
source [find target/stm32f1x.cfg]
